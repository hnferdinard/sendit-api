services:
  - type: web
    name: sendit-api
    runtime: python
    repo: https://github.com/hnferdinard/sendit-api
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: MAX_UPLOAD_SIZE
        value: 5242880
